<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digikala Product Crawler</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.18);
        }
        h1 {
            color: #c0392b;
            margin: 0 0 4px 0;
            font-size: 26px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .status-bar {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status-ok    { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .status-warning{ background:#fff3cd; color:#856404; border:1px solid #ffeaa7; }
        .status-error  { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }

        /* --- Crawl form --- */
        .crawl-form {
            display:flex;
            gap:10px;
            margin-bottom:28px;
            flex-wrap:wrap;
        }
        .crawl-form input[type="url"] {
            flex:1;
            min-width:260px;
            padding:13px 16px;
            font-size:15px;
            border:2px solid #ddd;
            border-radius:8px;
            transition:border-color .2s;
        }
        .crawl-form input[type="url"]:focus {
            outline:none;
            border-color:#c0392b;
        }
        .btn-crawl {
            padding:13px 28px;
            font-size:15px;
            font-weight:700;
            background:#c0392b;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition:background .2s;
        }
        .btn-crawl:hover { background:#a93226; }
        .btn-crawl:disabled { background:#ccc; cursor:not-allowed; }

        /* --- Single crawl result --- */
        .result-card {
            padding:20px;
            background:#fafafa;
            border-left:4px solid #c0392b;
            margin-bottom:20px;
            border-radius:8px;
        }
        .result-card h2 {
            margin:0 0 10px 0;
            color:#333;
            font-size:18px;
        }
        .result-card .meta-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:6px 20px;
            margin-bottom:10px;
        }
        .result-card .meta-row {
            font-size:14px;
            color:#555;
        }
        .result-card .meta-row b {
            color:#333;
        }
        .result-card .product-link {
            display:inline-block;
            margin-top:8px;
            color:#c0392b;
            text-decoration:none;
            font-weight:600;
        }
        .result-card .product-link:hover { text-decoration:underline; }

        .product-thumb {
            width:120px;
            height:120px;
            object-fit:contain;
            border:1px solid #ddd;
            border-radius:6px;
            background:#fff;
            float:right;
            margin:0 0 12px 16px;
        }

        /* --- Crawl history list --- */
        .history-title {
            font-size:17px;
            color:#555;
            margin:28px 0 12px 0;
            padding-bottom:8px;
            border-bottom:2px solid #f0d0c8;
        }

        /* ─── Shared UI bits ─── */
        .loader {
            display:none;
            text-align:center;
            padding:16px;
            color:#c0392b;
        }
        .spinner {
            display:inline-block;
            width:18px;height:18px;
            border:3px solid #f3f3f3;
            border-top:3px solid #c0392b;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin-right:8px;
            vertical-align:middle;
        }
        @keyframes spin { to{transform:rotate(360deg);} }
        .footer {
            margin-top:24px;
            font-size:12px;
            color:#aaa;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕷️ Digikala Product Crawler</h1>
        <p class="subtitle">Enter a Digikala product URL to extract and save product information.</p>

        <!-- Status Bar -->
        <div id="crawlStatus" class="status-bar status-warning">
            Ready — enter a Digikala product URL above.
        </div>

        <!-- Crawl Form -->
        <form id="crawlForm" class="crawl-form" onsubmit="doCrawl(event)">
            <input
                type="url"
                id="urlInput"
                placeholder="https://digikala.com/product/dkp-…"
                required
            />
            <button type="submit" id="crawlBtn" class="btn-crawl">Crawl</button>
        </form>

        <!-- Single crawl result -->
        <div id="loader" class="loader"><span class="spinner"></span> Crawling page…</div>
        <div id="singleResult"></div>

        <!-- Crawled products list -->
        <div id="historySection" style="display:none;">
            <div class="history-title" id="historyTitle"></div>
            <div id="productList"></div>
        </div>

        <div class="footer">
            Digikala Product Crawler — v1.0
        </div>
    </div>

    <script>
        let lastProducts = [];

        async function doCrawl(e) {
            e.preventDefault();
            const url     = document.getElementById('urlInput').value.trim();
            const btn     = document.getElementById('crawlBtn');
            const loader  = document.getElementById('loader');
            const status  = document.getElementById('crawlStatus');

            if (!url) return;

            btn.disabled    = true;
            loader.style.display = 'block';
            document.getElementById('singleResult').innerHTML = '';
            status.className = 'status-bar status-warning';
            status.textContent = '⏳ Crawling… please wait.';

            try {
                const resp = await fetch('/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await resp.json();

                if (resp.ok && data.status === 'success') {
                    renderSingleResult(data.product);
                    status.className = 'status-bar status-ok';
                    status.textContent = `✅ ${data.message}`;
                    refreshProductsList();
                } else {
                    status.className = 'status-bar status-error';
                    status.textContent = data.message || 'Crawl failed.';
                }
            } catch (err) {
                console.error('Crawl error:', err);
                status.className = 'status-bar status-error';
                status.textContent = 'Network error: ' + err.message;
            } finally {
                btn.disabled     = false;
                loader.style.display = 'none';
            }
        }

        function esc(s) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(s || ''));
            return d.textContent;
        }

        function renderSingleResult(p) {
            const container = document.getElementById('singleResult');
            if (!p) return;

            // Helper: safe image (only use http/s src)
            const imgSrc = (p.image_url && /^https?:\/\//i.test(p.image_url))
                         ? esc(p.image_url)
                         : null;

            let html = `
              <div class="result-card">
                ${imgSrc
                  ? `<img class="product-thumb" src="${imgSrc}" alt="product image" loading="lazy"
                         onerror="this.parentNode.parentNode.removeChild(this.parentNode)" />`
                  : ''}
                <h2>${esc(p.title || 'Unknown product')}</h2>
                <div class="meta-grid">
                  <div class="meta-row"><b>Price:</b> ${esc(p.price || '—')}</div>
                  <div class="meta-row"><b>Rating:</b> ${esc(p.rating || '—')}</div>
                  <div class="meta-row"><b>Comments:</b> ${esc(p.comments_count || '—')}</div>
                </div>
            `;
            if (imgSrc) {
                html += `<a class="product-link" href="${esc(p.product_url)}" target="_blank" rel="noopener">
                            🔗 Open on Digikala
                         </a>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        async function refreshProductsList() {
            try {
                const resp = await fetch('/products');
                const data  = await resp.json();
                lastProducts = data.products || [];
                renderProductsList();
            } catch (err) {
                console.error('Failed to load product list:', err);
            }
        }

        function renderProductsList() {
            const section  = document.getElementById('historySection');
            const list     = document.getElementById('productList');
            const title    = document.getElementById('historyTitle');

            if (!lastProducts.length) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            title.textContent     = `📦 Crawled Products (${lastProducts.length})`;

            list.innerHTML = lastProducts.map(p => {
                const imgSrc = (p.image_url && /^https?:\/\//i.test(p.image_url))
                             ? esc(p.image_url) : '';
                return `
                <div class="result-card" style="border-left-color:#888;">
                    ${imgSrc
                      ? `<img class="product-thumb" src="${imgSrc}" alt="product"
                             loading="lazy"
                             onerror="this.remove()" style="width:90px;height:90px;"/>`
                      : ''}
                    <b>${esc(p.title || 'Unknown')}</b>
                    <div class="meta-grid">
                        <div class="meta-row"><b>Price:</b> ${esc(p.price || '—')}</div>
                        <div class="meta-row"><b>Rating:</b> ${esc(p.rating || '—')}</div>
                    </div>
                    ${p.product_url
                      ? `<a class="product-link" href="${esc(p.product_url)}" target="_blank" rel="noopener">
                           🔗 View on Digikala
                         </a>` : ''}
                    <div style="margin-top:6px;font-size:11px;color:#aaa;">
                        Crawled on ${esc(p.created_at || '')}
                    </div>
                </div>`;
            }).join('');
        }

        // Load product list on page load
        refreshProductsList();
        // Also refresh when the status bar is updated
        document.addEventListener('DOMContentLoaded', () => {
            // status query is fire-and-forget; list loads directly above
        });
    </script>
</body>
</html>
